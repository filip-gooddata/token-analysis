<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token usage drill-down</title>
<style>
html, body { margin: 0; padding: 0; }
body { padding: 24px 32px; }
@media (max-width: 600px) { body { padding: 16px 12px; } }
.tkd {
  --fg: var(--foreground, #0b0b0b);
  --fg2: var(--muted-foreground, #52514e);
  --wash: var(--muted, #f0efec);
  --hover: var(--accent, #ebeae6);
  --line: var(--border, #e1e0d9);
  --surface: var(--card, #fcfcfb);
  --rad: var(--radius, 8px);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #8a63d2;
  --other: color-mix(in srgb, var(--fg) 30%, transparent);
  max-width: 1080px;
  margin-inline: auto;
  position: relative; color: var(--fg);
  font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  font-size: 14px; line-height: 1.4;
}
.tkd * { box-sizing: border-box; }
@media (prefers-color-scheme: dark) {
  html { color-scheme: dark; background: var(--background, #141413); }
  .tkd {
    --fg: var(--foreground, #ededec);
    --fg2: var(--muted-foreground, #a3a29e);
    --wash: var(--muted, #262624);
    --hover: var(--accent, #30302e);
    --line: var(--border, #3a3a37);
    --surface: var(--card, #1c1c1b);
  }
}
.tkd button { font: inherit; color: inherit; }
.tkd .controls { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
.tkd .seg { display: inline-flex; background: var(--wash); border-radius: var(--rad); padding: 2px; }
.tkd .seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: calc(var(--rad) - 2px); cursor: pointer; font-size: 13px; color: var(--fg2); white-space: nowrap; }
.tkd .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.tkd select { font: inherit; font-size: 13px; color: var(--fg); background: var(--wash); border: 0; border-radius: var(--rad); padding: 5px 8px; cursor: pointer; }
.tkd .sample { margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--fg2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.tkd .hint { font-size: 12px; color: var(--fg2); margin: 0 0 10px; }
.tkd #coverage { margin: 12px 0 0; }
.tkd .wrap { overflow-x: auto; padding-bottom: 6px; }
.tkd svg { display: block; overflow: visible; }
.tkd .seg-r { cursor: default; transition: opacity .15s; }
.tkd .seg-r.drill { cursor: pointer; }
.tkd .seg-r:hover { filter: brightness(1.1); }
.tkd .seg-r:focus-visible { outline: none; stroke: var(--fg); stroke-width: 2; }
.tkd .sel { stroke: var(--fg); stroke-width: 2; }
.tkd text { pointer-events: none; }
.tkd .hd { fill: var(--fg2); font-size: 12px; }
.tkd .hv { fill: var(--fg); font-size: 15px; font-weight: 600; }
.tkd .sl { font-size: 11px; font-weight: 600; }
.tkd .sv { font-size: 11px; opacity: .85; }
.tkd .ghost { fill: none; stroke: var(--line); stroke-dasharray: 4 4; }
.tkd .gt { fill: var(--fg2); font-size: 12px; }
.tkd .li { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; border: 0; background: none; text-align: left; font-size: 13px; min-width: 0; }
.tkd button.li { cursor: pointer; }
.tkd button.li:hover { background: var(--hover); }
.tkd .li .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.tkd .li .lb { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tkd .li .vv { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tkd .li .pp { color: var(--fg2); font-size: 12px; font-variant-numeric: tabular-nums; width: 40px; text-align: right; }
.tkd .timeline { border: 1px solid var(--line); border-radius: var(--rad); padding: 8px 10px 6px; margin-bottom: 12px; }
.tkd .thead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 4px; }
.tkd .thead .t { font-size: 12px; font-weight: 600; color: var(--fg2); }
.tkd .thead .tl { flex: 0 1 17em; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.tkd .thead .tn { flex: 0 0 10em; font-size: 12px; color: var(--fg2); white-space: nowrap; }
.tkd .track { --th: 18px; position: relative; height: 30px; touch-action: none; cursor: pointer; }
.tkd .track .rail, .tkd .track .fill { position: absolute; top: 13px; height: 4px; border-radius: 2px; pointer-events: none; }
.tkd .track .rail { left: calc(var(--th) / 2); right: calc(var(--th) / 2); background: var(--wash); }
.tkd .track .fill { background: var(--c1); }
.tkd .track input { position: absolute; inset: 0; width: 100%; height: 30px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.tkd .track input::-webkit-slider-runnable-track { background: none; height: 30px; }
.tkd .track input::-moz-range-track { background: none; }
.tkd .track input::-webkit-slider-thumb { -webkit-appearance: none; width: var(--th); height: var(--th); margin-top: 6px; border-radius: 50%; background: var(--surface); border: 2px solid var(--c1); cursor: grab; }
.tkd .track input::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--c1); cursor: grab; }
.tkd .track input:focus { z-index: 1; }
.tkd .track input:focus-visible { outline: none; }
.tkd .track input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c1) 35%, transparent); }
.tkd .track input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c1) 35%, transparent); }
.tkd .tends { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.tkd .models { border: 1px solid var(--line); border-radius: var(--rad); padding: 8px 10px; margin-bottom: 12px; }
.tkd .mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 6px; }
.tkd .mhead .t { font-size: 12px; font-weight: 600; color: var(--fg2); }
.tkd .mhead .hint { margin: 0; }
.tkd .mlist { display: flex; flex-wrap: wrap; gap: 2px 18px; }
.tkd .mi { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; font-size: 13px; cursor: pointer; min-width: 0; }
.tkd .mi:hover { background: var(--hover); }
.tkd .mi input { margin: 0; flex: none; }
.tkd .mi .lb { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tkd .mi .vv { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tkd .mi .pp { color: var(--fg2); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tkd .mi.off .lb, .tkd .mi.off .vv { color: var(--fg2); font-weight: 400; }
.tkd .empty { fill: var(--fg2); font-size: 14px; }
.tkd .main { display: grid; grid-template-columns: minmax(0, max-content) minmax(300px, 1fr); gap: 16px 28px; align-items: start; }
.tkd .chartcol { min-width: 0; }
.tkd .detail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; border: 1px solid var(--line); border-radius: var(--rad); background: var(--surface); padding: 12px 14px; min-width: 0; container-type: inline-size; }
@media (max-width: 860px) {
  .tkd .main { grid-template-columns: minmax(0, 1fr); }
  .tkd .detail { position: static; max-height: none; }
}
.tkd .detail h2 { font-size: 16px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
.tkd .detail .dpath { font-size: 12px; color: var(--fg2); margin: 2px 0 10px; overflow-wrap: anywhere; }
.tkd .detail .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px 12px; margin-bottom: 14px; }
.tkd .detail .st .k { font-size: 11px; color: var(--fg2); }
.tkd .detail .st .x { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tkd .detail h3 { font-size: 12px; font-weight: 600; color: var(--fg2); margin: 12px 0 6px; }
.tkd .detail .donut { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.tkd .detail .donut .legend { flex: 0 1 auto; min-width: 0; display: grid; grid-template-columns: 10px minmax(0, max-content) max-content max-content; gap: 5px 8px; align-items: center; margin: 0; }
.tkd .detail .dbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 28px; }
.tkd .detail .dbody > section { min-width: 0; }
@container (min-width: 720px) { .tkd .detail .dbody { grid-template-columns: minmax(0, max-content) minmax(300px, 1fr); } }
.tkd #hist { max-width: 100%; height: auto; }
.tkd .detail .donut .li { display: contents; }
.tkd .detail .donut .li .pp { margin-right: 14px; }
.tkd .detail .note { font-size: 12px; color: var(--fg2); margin: 6px 0 0; }
.tkd .detail .xref { font-size: 13px; margin: -6px 0 12px; padding: 6px 8px; border: 1px solid var(--line); border-radius: calc(var(--rad) - 2px); }
.tkd .detail .xref button { border: 0; background: transparent; padding: 0; color: var(--fg); text-decoration: underline; cursor: pointer; }
.tkd .dc { fill: var(--fg); font-size: 13px; font-weight: 600; }
.tkd .dk { fill: var(--fg2); font-size: 10px; }
.tkd .hb { fill: var(--c1); }
.tkd .hb2 { fill: var(--c3); }
.tkd .hz { fill: var(--wash); }
.tkd .ax { stroke: var(--line); }
.tkd .at { fill: var(--fg2); font-size: 10px; }
.tkd .hit { fill: transparent; }
.tkd .hit:focus-visible { outline: none; stroke: var(--fg); stroke-width: 1.5; }
.tkd .tip { position: absolute; pointer-events: none; z-index: 5; display: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--rad); padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 240px; }
.tkd .tip .tv { font-size: 15px; font-weight: 600; }
.tkd .tip .tl { color: var(--fg2); margin-bottom: 4px; }
.tkd .tip .tr { display: flex; justify-content: space-between; gap: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.tkd .tip .tr b { color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<div class="tkd" id="tkd">
  <div class="controls">
    <select id="f-role" aria-label="Agent role"></select>
    <div class="seg" id="f-metric" aria-label="Metric"></div>
    <span class="sample" id="src-pill"></span>
  </div>
  <div class="timeline" id="f-time" role="group" aria-label="Time period">
    <div class="thead">
      <span class="t">Period</span>
      <div class="seg" id="f-range" aria-label="Period shortcuts"></div>
      <span class="tl" id="t-label" aria-live="polite"></span>
      <span class="tn" id="t-days"></span>
    </div>
    <div class="track" id="t-track">
      <div class="rail"></div><div class="fill" id="t-fill"></div>
      <input type="range" id="t-from" aria-label="Start of the period" min="0" step="1">
      <input type="range" id="t-to" aria-label="End of the period" min="0" step="1">
    </div>
    <div class="tends"><span id="t-first"></span><span id="t-last"></span></div>
  </div>
  <div class="models" id="f-models" role="group" aria-label="Models">
    <div class="mhead">
      <span class="t">Models</span>
      <div class="seg" id="f-mclass" aria-label="Select models"></div>
      <span class="hint">Claude / GPT select only that class; shift-click adds or removes the class instead.</span>
    </div>
    <div class="mlist" id="f-mlist"></div>
  </div>
  <p class="hint">Click a segment to see its details. Segments marked › also break down in a new bar; click an open one again to collapse it.</p>
  <div class="main">
    <div class="chartcol">
      <div class="wrap" id="wrap"><svg id="chart" role="img" aria-label="Drill-down stacked bars"></svg></div>
    </div>
    <aside class="detail" id="detail" aria-live="polite" aria-label="Selected segment details"></aside>
  </div>
  <p class="hint" id="coverage" hidden></p>
  <div class="tip" id="tip" role="tooltip"></div>
</div>
<script>
const DATA = /*__DATA__*/null;
const METRICS = [{ id: 'billed', label: 'Billed tokens' }, { id: 'unique', label: 'Unique tokens' }, { id: 'usd', label: '$ at API rates' }];
const COLORS = [1, 2, 3, 4, 5, 6].map(i => `var(--c${i})`);
const INK = ['#fff', '#111', '#111', '#111', '#111', '#fff'];
const ROOT = { id: 'root', label: 'All tokens', children: DATA.tree };
const ROLE_IDS = DATA.roles.map(r => r.id), MODEL_IDS = DATA.models.map(m => m.id);
const MODEL_STORE = 'tkd.models';  // excluded model ids, so models that appear later start selected
const loadModels = () => {
  let off = [];
  try { off = JSON.parse(localStorage.getItem(MODEL_STORE) || '[]'); } catch (e) { off = []; }
  return new Set(MODEL_IDS.filter(id => !(Array.isArray(off) && off.includes(id))));
};
const saveModels = () => { try { localStorage.setItem(MODEL_STORE, JSON.stringify(MODEL_IDS.filter(id => !state.models.has(id)))); } catch (e) { /* storage unavailable */ } };
const NDAYS = DATA.days.count, LAST = NDAYS - 1;
const PRESETS = [{ id: 'today', label: 'Today', days: 1 }, { id: '7d', label: '7 days', days: 7 }, { id: '30d', label: '30 days', days: 30 }];
const presetFrom = p => Math.max(0, NDAYS - p.days);
// from and to are day indexes; 0 and LAST are the unbounded ends
const state = { metric: 'billed', from: presetFrom(PRESETS[2]), to: LAST, models: loadModels(), role: 'all', path: [], focus: [] };
const CLASSES = [{ id: 'anthropic', label: 'Claude' }, { id: 'openai', label: 'GPT' }];
const providerOf = id => (DATA.models.find(m => m.id === id) || {}).provider || 'other';
const zero = () => ({ billed: 0, unique: 0, usd: 0 });
// The current period, role and (unless allModels) model selection, as a test on a leaf row [day, model, role, ...].
function filterOf(allModels) {
  const lo = state.from > 0 ? state.from : -Infinity, hi = state.to < LAST ? state.to : Infinity;
  const on = MODEL_IDS.map(id => allModels || state.models.has(id)), k = ROLE_IDS.indexOf(state.role);
  return r => r[0] >= lo && r[0] <= hi && on[r[1]] && (state.role === 'all' || r[2] === k);
}
function deriveLeaf(leaf, keep) {
  const out = zero();
  for (const r of leaf.v || []) if (keep(r)) { out.billed += r[3]; out.unique += r[4]; out.usd += r[5]; }
  return out;
}
function computeAll() {
  const keep = filterOf(false);
  const vals = new Map();
  const walk = (node, cat) => {
    let v;
    if (node.children) {
      v = zero();
      for (const c of node.children) {
        const cv = walk(c, cat || c.id);
        v.billed += cv.billed; v.unique += cv.unique; v.usd += cv.usd;
      }
    } else v = deriveLeaf(node, keep);
    vals.set(node.id, v);
    return v;
  };
  walk(ROOT, null);
  return vals;
}
function fmt(n, metric) {
  if (metric === 'usd') {
    if (n >= 1e4) return '$' + (n / 1e3).toFixed(1) + 'K';
    if (n >= 100) return '$' + Math.round(n).toLocaleString('en-US');
    if (n >= 1) return '$' + n.toFixed(2);
    return n > 0 ? '$' + n.toFixed(3) : '$0';
  }
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K';
  return String(Math.round(n));
}
const pct = x => !x ? '0%' : x < 0.001 ? '<0.1%' : (x * 100).toFixed(x < 0.1 ? 1 : 0) + '%';
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
const clip = (s, w, px) => { const n = Math.floor(w / px); return s.length > n ? s.slice(0, Math.max(1, n - 1)) + '…' : s; };
function buildControls() {
  const seg = (host, items, key) => {
    host.replaceChildren();
    for (const it of items) {
      const b = el('button', null, it.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(state[key] === it.id));
      b.addEventListener('click', () => { state[key] = it.id; buildControls(); buildModels(); render(); });
      host.append(b);
    }
  };
  const pr = $('f-range');
  pr.replaceChildren();
  for (const p of PRESETS) {
    const b = el('button', null, p.label);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(state.to === LAST && state.from === presetFrom(p)));
    b.addEventListener('click', () => setPeriod(presetFrom(p), LAST));
    pr.append(b);
  }
  seg($('f-metric'), METRICS, 'metric');
  const sel = (host, items, key, allLabel) => {
    if (!host.options.length) {
      host.append(new Option(allLabel, 'all'));
      for (const it of items) host.append(new Option(it.label, it.id));
      host.addEventListener('change', () => { state[key] = host.value; buildModels(); render(); });
    }
    host.value = state[key];
  };
  sel($('f-role'), DATA.roles, 'role', 'All roles');
}
// Per-model totals over the whole tree for the current period and role, ignoring the model selection.
// A model with usage on any collected day stays listed.
function modelTotals() {
  const keep = filterOf(true);
  const t = MODEL_IDS.map(() => zero()), seen = MODEL_IDS.map(() => false);
  const walk = n => {
    if (n.children) return n.children.forEach(walk);
    for (const r of n.v || []) {
      seen[r[1]] = true;
      if (keep(r)) { const x = t[r[1]]; x.billed += r[3]; x.unique += r[4]; x.usd += r[5]; }
    }
  };
  walk(ROOT);
  return { t, seen };
}
function setModels(ids) {
  state.models = new Set(ids);
  saveModels();
  buildModels();
  render();
}
function buildModels() {
  const { t, seen } = modelTotals(), m = state.metric;
  const shown = MODEL_IDS.filter((id, i) => seen[i]);
  const grand = shown.reduce((a, id) => a + t[MODEL_IDS.indexOf(id)][m], 0);
  const same = ids => ids.length === state.models.size && ids.every(id => state.models.has(id));
  const host = $('f-mclass');
  host.replaceChildren();
  const btn = (label, pressed, title, onClick) => {
    const b = el('button', null, label);
    b.type = 'button';
    b.title = title;
    b.setAttribute('aria-pressed', String(pressed));
    b.addEventListener('click', onClick);
    host.append(b);
  };
  btn('All', same(shown), 'Select every model', () => setModels(shown));
  btn('None', state.models.size === 0, 'Clear the selection', () => setModels([]));
  for (const cl of CLASSES) {
    const ids = shown.filter(id => providerOf(id) === cl.id);
    btn(cl.label, ids.length > 0 && same(ids), `Only ${cl.label} models (shift-click: add or remove ${cl.label} models)`, e => {
      if (!e.shiftKey) return setModels(ids);
      const all = ids.every(id => state.models.has(id));
      setModels(all ? [...state.models].filter(id => !ids.includes(id)) : [...state.models, ...ids]);
    });
  }
  const list = $('f-mlist');
  list.replaceChildren();
  for (const id of shown) {
    const mi = MODEL_IDS.indexOf(id), on = state.models.has(id), v = t[mi];
    const row = el('label', 'mi' + (on ? '' : ' off'));
    const cb = el('input');
    cb.type = 'checkbox'; cb.checked = on; cb.value = id;
    cb.addEventListener('change', () => setModels(cb.checked ? [...state.models, id] : [...state.models].filter(x => x !== id)));
    const name = DATA.models[mi].label;
    row.title = `${name}: ${fmt(v.billed, 'billed')} billed tokens, ${fmt(v.usd, 'usd')}`;
    row.append(cb, el('span', 'lb', name), el('span', 'vv', fmt(v.billed, 'billed')), el('span', 'pp', fmt(v.usd, 'usd')),
      el('span', 'pp', pct(grand ? v[m] / grand : 0)));
    list.append(row);
  }
}
const tip = $('tip');
function showTip(ev, label, v, parentV, rootV, node) {
  const m = state.metric;
  tip.replaceChildren(el('div', 'tv', fmt(v[m], m)), el('div', 'tl', label));
  const rows = [['Share of parent', pct(parentV ? v[m] / parentV : 0)], ['Share of total', pct(rootV ? v[m] / rootV : 0)],
    ...METRICS.filter(x => x.id !== m).map(x => [x.label, fmt(v[x.id], x.id)])];
  if (v.unique) rows.push(['Avg reads per token', (v.billed / v.unique).toFixed(1) + '×']);
  const basis = node && basisOf(node);
  if (basis) rows.push(['Basis', basis]);
  for (const [a, b] of rows) { const r = el('div', 'tr'); r.append(el('span', null, a), el('b', null, b)); tip.append(r); }
  tip.style.display = 'block';
  const host = $('tkd').getBoundingClientRect();
  const x = ev.clientX - host.left + 14, y = ev.clientY - host.top + 14;
  tip.style.left = Math.max(0, Math.min(x, host.width - tip.offsetWidth)) + 'px';
  tip.style.top = y + 'px';
}
function basisOf(node) {
  const set = new Set(), walk = n => n.children ? n.children.forEach(walk) : set.add(n.basis || 'estimated');
  walk(node);
  return set.size === 1 ? [...set][0] : 'mixed: ' + [...set].sort().join(', ');
}

    if (Math.abs(e.clientX - drag.x0) < 2) return;
    drag.fixed = e.clientX < drag.x0 ? state.to : state.from;
  }
  moveBound(Math.round(t.pos(e.clientX)));
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) track.addEventListener(type, e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag = null;
  track.style.cursor = '';
});
$('t-first').textContent = dayLabel(0);
$('t-last').textContent = dayLabel(LAST);
paintPeriod();
buildControls();
buildModels();
render();
let resizeQueued = false;
window.addEventListener('resize', () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; render(); });
});
</script>
