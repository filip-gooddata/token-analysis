# On every pull request: run the tests. The macOS binaries are built only by release.yml.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test
        run: |
          python -I collector/test_collect.py
          python -I collector/test_token_analysis.py
